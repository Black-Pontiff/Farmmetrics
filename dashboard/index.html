<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farm Metrics Dashboard</title><style>body{font-family:system-ui;margin:2rem;background:#f4f7f2;color:#17351d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem}.card{background:white;padding:1.2rem;border-radius:12px;box-shadow:0 1px 5px #0002}.value{font-size:2rem}button{padding:.7rem 1rem;background:#287d35;color:white;border:0;border-radius:8px}</style></head><body><h1>🌱 Farm Metrics</h1><button id="demo">Load demo data</button><div class="grid" id="cards"><div class="card">Soil <div class="value" data-f="soil_moisture">--</div></div><div class="card">Temperature <div class="value" data-f="temperature">--</div></div><div class="card">Humidity <div class="value" data-f="humidity">--</div></div><div class="card">Light <div class="value" data-f="light_lux">--</div></div></div><h2>Recommendations</h2><div id="recs">Waiting for telemetry…</div><script>const cards=document.getElementById('cards');const es=new EventSource('/api/stream/telemetry');es.addEventListener('telemetry',e=>{const d=JSON.parse(e.data);cards.querySelectorAll('[data-f]').forEach(x=>x.textContent=d[x.dataset.f]);fetch('/api/recommendations/latest').then(r=>r.json()).then(a=>document.getElementById('recs').innerHTML=a.map(x=>`<p><b>[${x.severity}]</b> ${x.message}</p>`).join(''))});document.getElementById('demo').onclick=()=>fetch('/api/simulate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({scenario:'normal',ticks:20})});</script></body></html>
